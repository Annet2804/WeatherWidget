<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <div class="findCity"> 
        <a id="containerImgLoupe" class="containerImgLoupe"><img class="imgLoupe" src="photos/loupe.png"></a>
        <div>
            <div class="outlineInputContainer">
                <label id="city"></label>
                <input id="inputEnterCity" type="text" name="city" placeholder="Enter City Name">
                <div class="outlineInput"></div>
            </div>
        </div>
    </div>

    <div class="line"></div>

    <div class="todayWeather">
        <div class="ImageDescContainer">
            <div class="sunImageDiv"><img class="sunImage" id="weatherImg" alt="" src="photos/weather/sunRain.png"></div>
            <p id="description" class="description">Partly Cloudy</p>
        </div>

        <div class="dateTimeContainer">
            <div class="dateTime">
                <div class="date"><span class="date" id="todayData"></span></div>
                <div class="time">21 : 55</div>
            </div>

            <div class="lineUnderTime"></div>

            <div class="temperatureContainer">

                <div class="temperatureHiLoContainer">
                    <div class="temperature">
                        <span  id="temperature">13 </span>
                        <span class="celsium">°</span>
                    </div>

                    <div class="hiLoTemperature">
                        <div class="higher">Hi: <span id="higherTodayTemp"></span> </div>
                        <div class="lover">Lo: <span id="lowerTodayTemp"></span> </div>
                    </div>
                </div>

                <div class="additionalToTemperature">
                    <div class="FeelsLike"> Feels Like: <span id="feelsLikeToday"></span> </div>
                    <div class="Humidity"> Humidity: <span id="humidityToday"></span></div>
                    <div class="Wind">Wind: <span id="windToday"></span></div>
                </div>
            </div>

        </div>
    </div>

    <div class="line"></div>

    <div class="WeeklyForecastContainer">
        <div class="ForecastContainer">
            <div class="Day">Mon</div>
            <img class="iconDay" src="photos/sunIcon.png" alt="">
            <div class="highLowTempDay">
                <div class="highTempDay">Hi </div>
                <div class="lowTempDay">Lo </div>
            </div>
        </div>

        <div  class="verticalLine"></div>

        <div class="ForecastContainer">
            <div class="Day">Mon</div>
            <img class="iconDay" src="photos/sunIcon.png" alt="">
            <div class="highLowTempDay">
                <div class="highTempDay">Hi </div>
                <div class="lowTempDay">Lo </div>
            </div>
        </div>

        <div  class="verticalLine"></div>

        <div class="ForecastContainer">
            <div class="Day">Mon</div>
            <img class="iconDay" src="photos/sunIcon.png" alt="">
            <div class="highLowTempDay">
                <div class="highTempDay">Hi </div>
                <div class="lowTempDay">Lo </div>
            </div>
        </div>

        <div  class="verticalLine"></div>

        <div class="ForecastContainer">
            <div class="Day">Mon</div>
            <img class="iconDay" src="photos/sunIcon.png" alt="">
            <div class="highLowTempDay">
                <div class="highTempDay">Hi </div>
                <div class="lowTempDay">Lo </div>
            </div>
        </div>

        <div  class="verticalLine"></div>

        <div class="ForecastContainer">
            <div class="Day">Mon</div>
            <img class="iconDay" src="photos/sunIcon.png" alt="">
            <div class="highLowTempDay">
                <div class="highTempDay">Hi </div>
                <div class="lowTempDay">Lo </div>
            </div>
        </div>





    </div>

    <div class="line"></div>

    <p class="nameOfWidget">My Weather Widget API</p>

</div>




<script src="script.js"></script>
</body>
</html>
